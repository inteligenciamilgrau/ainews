name: Minificar e Fazer Deploy no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar ambiente Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar minificadores de CSS e HTML
        run: python -m pip install rcssmin==1.1.2 htmlmin==0.1.12

      - name: Preparar dist e minificar CSS e HTML
        run: python .github/scripts/minify_static.py

      # O esbuild le a sintaxe de verdade. So remove espacos e comentarios do codigo:
      # nao renomeia nada e nao mexe no texto dentro de strings e templates.
      - name: Minificar JavaScript
        run: |
          find dist -name '*.js' -print0 | xargs -0 npx --yes esbuild@0.28.2 \
            --minify-whitespace --charset=utf8 --log-level=warning \
            --outdir=dist --outbase=dist --allow-overwrite

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer upload apenas da pasta minificada
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Fazer deploy do site
        id: deployment
        uses: actions/deploy-pages@v5
